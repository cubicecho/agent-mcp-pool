name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run lint` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      # The suites boot a real stdio MCP server out of tests/fixtures, so this
      # covers the transports as well as the pool.
      #
      # Coverage rather than a bare run, so the summary is in the log for a
      # reviewer to read. Deliberately no threshold: a number that fails a build
      # gets met by whatever test raises it fastest, which is not the same as
      # being tested. What it is for is noticing a module that stops being.
      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      # dist is gitignored, so the tarball is entirely what this step just
      # emitted. A tsc that succeeds while emitting nothing would otherwise ship
      # a package with nothing to import.
      - name: The build emitted something to import
        run: test -s dist/index.js && test -s dist/index.d.ts

      # npm registers `prepare` as an install script and re-runs it inside the
      # installed tree, so the script itself has to be in the tarball — a
      # `prepare` naming a file `files` never shipped fails the whole install
      # with "Cannot find module".
      - name: The tarball carries the install script it declares
        run: |
          npm pack --silent >/dev/null
          tar -tzf ./*.tgz > packed.txt
          for f in package/dist/index.js package/scripts/prepare.mjs; do
            grep -qxF "$f" packed.txt \
              || { echo "::error::$f is not in the tarball"; exit 1; }
          done

      # And that re-run has to be a no-op there rather than a failed build.
      - name: Installing the tarball runs its prepare script without dying
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --foreground-scripts "$GITHUB_WORKSPACE"/*.tgz
          # Imported rather than resolved: `exports` is ESM-only, so `require.resolve` reports a
          # package with no main on a package that is perfectly importable.
          node -e "import('@cubicecho/agent-mcp-pool').then(m => { if (!m.McpPool) process.exit(1) })"
