name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # Formatting, lint, and import order in one pass. `ci` differs from
      # `npm run lint` only in never writing fixes.
      - name: Lint
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      # The suites boot a real stdio MCP server out of tests/fixtures, so this
      # covers the transports as well as the pool.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
